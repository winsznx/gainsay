<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gainsay{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='gainsay.css') }}">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">Gainsay</a>
    <p class="tagline">Checks the case citations in the other side's filings.</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

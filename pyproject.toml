[project]
name = "gainsay"
version = "0.1.0"
description = "Checks the case citations in an opposing party's federal court filings."
requires-python = ">=3.11,<3.14"
dependencies = [
    "neatlogs>=1.4.26",
    "pdfplumber>=0.11.10",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gainsay"]

[tool.pytest.ini_options]
testpaths = ["gainsay"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

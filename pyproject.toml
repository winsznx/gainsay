[project]
name = "gainsay"
version = "0.1.0"
description = "Checks the case citations in an opposing party's federal court filings."
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=1.13.0",
    "courts-db>=0.10.27",
    "eyecite>=2.7.8",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "neatlogs>=1.4.26",
    "pdfplumber>=0.11.10",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gainsay"]

[tool.vercel]
entrypoint = "gainsay.web.app:app"

[tool.pytest.ini_options]
testpaths = ["gainsay"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
